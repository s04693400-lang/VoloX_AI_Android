
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101014">
  <title>VoloX AI Chat</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #101014;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      background: #202027;
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 1px solid #38383f;
    }

    header a {
      color: #ff4242;
      text-decoration: none;
      font-size: 22px;
    }

    header h2 {
      margin: 0;
      font-size: 21px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
    }

    .message {
      padding: 13px 16px;
      margin: 12px 0;
      border-radius: 15px;
      max-width: 85%;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .user {
      background: #c93636;
      margin-left: auto;
    }

    .assistant {
      background: #292930;
      margin-right: auto;
    }

    .welcome {
      text-align: center;
      color: #aaa;
      margin-top: 80px;
    }

    .welcome h1 {
      color: #ff4242;
    }

    form {
      display: flex;
      gap: 8px;
      padding: 14px;
      background: #202027;
      border-top: 1px solid #38383f;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #444;
      background: #303039;
      color: white;
      outline: none;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 0 19px;
      background: #ff4242;
      color: white;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html">←</a>
    <h2>VoloX AI Chat</h2>
  </header>

  <div id="messages">
    <div class="welcome" id="welcome">
      <h1>VoloX AI</h1>
      <p>Your AI assistant experience starts here.</p>
      <p>Send a message to test the chat interface.</p>
    </div>
  </div>

  <form id="chatForm">
    <input
      id="messageInput"
      type="text"
      placeholder="Message VoloX AI..."
      autocomplete="off"
      required
    >
    <button type="submit">Send</button>
  </form>

  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const messages = document.getElementById("messages");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const message = input.value.trim();
      if (!message) return;

      document.getElementById("welcome")?.remove();

      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = message;
      messages.appendChild(userMessage);

      const reply = document.createElement("div");
      reply.className = "message assistant";
      reply.textContent =
        "Your message reached the VoloX chat interface! " +
        "The real AI connection will be added using a secure backend.";
      messages.appendChild(reply);

      input.value = "";
      messages.scrollTop = messages.scrollHeight;
    });
  </script>

</body>
</html>
